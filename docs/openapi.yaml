openapi: 3.0.3
info:
  title: E-commerce API
  version: 1.0.0
  description: Contrato HTTP das APIs de catálogo, estoque, carrinho e pedidos.
servers:
  - url: /
security:
  - ApiKeyAuth: []
tags:
  - name: Catálogo
    description: Cadastro, consulta, atualização, exclusão e filtragem de produtos.
  - name: Estoque
    description: Consulta e alteração da quantidade em estoque dos produtos.
  - name: Carrinho
    description: Criação de carrinho e gerenciamento de itens.
  - name: Pedidos
    description: Criação de pedidos e seus itens.
paths:
  /products:
    get:
      tags: [Catálogo]
      summary: Lista produtos do catálogo
      operationId: listProducts
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Produtos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Filtro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Catálogo]
      summary: Cria um produto com estoque zero
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Nome, slug ou preço inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Slug já utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products/{productId}:
    get:
      tags: [Catálogo]
      summary: Consulta um produto
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente ou deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Catálogo]
      summary: Atualiza nome, slug, descrição e preço
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Nome, slug ou preço inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente ou deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug já utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Catálogo]
      summary: Soft delete de um produto
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Produto marcado como deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente ou já deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks:
    get:
      tags: [Estoque]
      summary: Lista o estoque de todos os produtos
      operationId: listStocks
      responses:
        '200':
          description: Produtos e seus estoques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
  /stocks/{productId}:
    get:
      tags: [Estoque]
      summary: Consulta o estoque de um produto
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Produto e seu estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Estoque]
      summary: Define a quantidade em estoque de um produto
      operationId: updateStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockRequest'
      responses:
        '200':
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks/{productId}/increase:
    patch:
      tags: [Estoque]
      summary: Adiciona unidades ao estoque
      operationId: increaseStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Estoque incrementado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks/{productId}/decrease:
    patch:
      tags: [Estoque]
      summary: Remove unidades do estoque
      operationId: decreaseStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Estoque reduzido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Quantidade maior que o estoque atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cart:
    post:
      tags: [Carrinho]
      summary: Cria um carrinho vazio
      operationId: createCart
      responses:
        '201':
          description: Carrinho criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cart/{cartId}:
    get:
      tags: [Carrinho]
      summary: Retorna o carrinho e seus itens
      operationId: getCart
      parameters:
        - $ref: '#/components/parameters/CartIdPath'
      responses:
        '200':
          description: Carrinho encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Carrinho inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cart/items:
    post:
      tags: [Carrinho]
      summary: Adiciona um produto ao carrinho
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Item criado ou quantidade incrementada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto ou carrinho inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estoque insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cart/items/{productId}:
    delete:
      tags: [Carrinho]
      summary: Remove um item do carrinho
      operationId: removeCartItem
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
        - $ref: '#/components/parameters/CartIdQuery'
      responses:
        '200':
          description: Item removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Carrinho ou item inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders:
    post:
      tags: [Pedidos]
      summary: Cria um pedido e publica o evento OrderCreated
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido criado com preços atuais e total calculado pelo servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Lista de itens vazia ou quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Usuário ou produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estoque insuficiente para a quantidade agregada solicitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Forbidden:
      description: Header x-api-key ausente ou diferente de X_API_KEY
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    CartIdPath:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartIdQuery:
      name: cartId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Order:
      type: object
      required: [id, userId, status, total, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: integer
          enum: [0, 1]
          description: 0 = PENDING; 1 = PAYMENT_PENDING
        total:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: double
    CreateOrderRequest:
      type: object
      required: [userId, items]
      properties:
        userId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'
    CreateOrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    Cart:
      type: object
      required: [id, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required: [id, productId, quantity]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    Product:
      type: object
      required: [id, name, slug, description, price, stock]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
          minimum: 0
    CreateProductRequest:
      type: object
      required: [name, slug, price]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
    UpdateProductRequest:
      type: object
      required: [name, slug, price]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
    AddCartItemRequest:
      type: object
      required: [cartId, productId, quantity]
      properties:
        cartId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    UpdateStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    AdjustStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [error, message, statusCode]
      properties:
        error:
          type: string
          example: ProductNotFoundError
        message:
          type: string
        statusCode:
          type: integer

openapi: 3.0.3
info:
  title: E-commerce Cart and Stock API
  version: 1.0.0
  description: Contrato HTTP das APIs de carrinho, estoque e catálogo.
servers:
  - url: /
security:
  - ApiKeyAuth: []
paths:
  /cart:
    post:
      summary: Cria um carrinho vazio
      operationId: createCart
      responses:
        '201':
          description: Carrinho criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cart/{cartId}:
    get:
      summary: Retorna o carrinho e seus itens
      operationId: getCart
      parameters:
        - $ref: '#/components/parameters/CartIdPath'
      responses:
        '200':
          description: Carrinho encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Carrinho inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cart/items:
    post:
      summary: Adiciona um produto ao carrinho
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Item criado ou quantidade incrementada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto ou carrinho inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estoque insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cart/items/{productId}:
    delete:
      summary: Remove um item do carrinho
      operationId: removeCartItem
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
        - $ref: '#/components/parameters/CartIdQuery'
      responses:
        '200':
          description: Item removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Carrinho ou item inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks:
    get:
      summary: Lista o estoque de todos os produtos
      operationId: listStocks
      responses:
        '200':
          description: Produtos e seus estoques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
  /stocks/{productId}:
    get:
      summary: Consulta o estoque de um produto
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Produto e seu estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Define a quantidade em estoque de um produto
      operationId: updateStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockRequest'
      responses:
        '200':
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks/{productId}/increase:
    patch:
      summary: Adiciona unidades ao estoque
      operationId: increaseStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Estoque incrementado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stocks/{productId}/decrease:
    patch:
      summary: Remove unidades do estoque
      operationId: decreaseStock
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Estoque reduzido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Quantidade inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Quantidade maior que o estoque atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /products:
    get:
      summary: Lista produtos do catálogo
      operationId: listProducts
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Produtos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Filtro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria um produto com estoque zero
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Nome ou preço inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products/{productId}:
    get:
      summary: Consulta um produto
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente ou deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Atualiza nome, descrição e preço
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Nome ou preço inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente ou deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Soft delete de um produto
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: Produto marcado como deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Produto inexistente ou já deletado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Forbidden:
      description: Header x-api-key ausente ou diferente de X_API_KEY
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    CartIdPath:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CartIdQuery:
      name: cartId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Cart:
      type: object
      required: [id, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required: [id, productId, quantity]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    Product:
      type: object
      required: [id, name, description, price, stock]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
          minimum: 0
    CreateProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
    UpdateProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
    AddCartItemRequest:
      type: object
      required: [cartId, productId, quantity]
      properties:
        cartId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    UpdateStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
    AdjustStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    Error:
      type: object
      required: [error, message, statusCode]
      properties:
        error:
          type: string
          example: ProductNotFoundError
        message:
          type: string
        statusCode:
          type: integer
